# Apache virtual host for SproutRoute.
# setup.sh copies this to /etc/apache2/sites-available/sproutroute.conf
# and replaces __APP_DIR__ and __SERVER_NAME__.
<VirtualHost *:80>
    ServerName __SERVER_NAME__
    DocumentRoot __APP_DIR__

    <Directory __APP_DIR__>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html index.php
    </Directory>

    # The app has no page at "/", send visitors to the home page.
    RedirectMatch 302 ^/$ /home/index.html

    # Never serve project internals.
    RedirectMatch 404 ^/(\.git|\.idea|database|deploy)(/|$)
    RedirectMatch 404 \.(md|sql|sh)$
    <Files "config.local.php">
        Require all denied
    </Files>

    # Uploaded photos are images only - never run code from there.
    <Directory __APP_DIR__/api/uploads>
        php_admin_flag engine off
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # The service worker must be re-checked so app updates reach users.
    <Files "sw.js">
        Header set Cache-Control "no-cache"
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/sproutroute-error.log
    CustomLog ${APACHE_LOG_DIR}/sproutroute-access.log combined
</VirtualHost>
